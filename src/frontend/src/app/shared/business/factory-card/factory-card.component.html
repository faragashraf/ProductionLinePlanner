<article class="plp-factory-card">
  <div class="plp-factory-card__head">
    <div class="plp-factory-card__info">
      <h3>{{ title }}</h3>
      <plp-status-badge *ngIf="subtitle" [status]="resolvedStatus" [label]="subtitle" [compact]="true"></plp-status-badge>
      <plp-product-metadata-row [label]="'بيانات ' + title">
        <plp-product-metadata-item [label]="metadataLabel" [value]="resolvedMetadataValue"></plp-product-metadata-item>
      </plp-product-metadata-row>
    </div>

    <div class="plp-factory-card__readiness">
      <plp-readiness-ring [value]="clampedReadiness" [status]="resolvedStatus" [size]="56"></plp-readiness-ring>
      <p class="plp-factory-card__readiness-percent">{{ clampedReadiness }}%</p>
      <plp-completion-bar [value]="clampedReadiness" [status]="resolvedStatus" [label]="progressLabel" class="plp-factory-card__readiness-bar"></plp-completion-bar>
    </div>
  </div>

  <ng-content />
</article>
