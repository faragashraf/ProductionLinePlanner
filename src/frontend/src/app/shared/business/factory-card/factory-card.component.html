<article class="plp-factory-card">
  <div class="plp-factory-card__head">
    <div>
      <h3>{{ title }}</h3>
      <p *ngIf="subtitle">{{ subtitle }}</p>
    </div>
    <plp-readiness-ring [value]="clampedReadiness" [status]="resolvedStatus" [size]="74"></plp-readiness-ring>
  </div>

  <plp-completion-bar [value]="clampedReadiness" [status]="resolvedStatus" label="جاهزية"></plp-completion-bar>
  <p class="plp-factory-card__meta">العاملون: {{ workersCurrent }} / {{ workersRequired }}</p>
  <ng-content />
</article>
