<plp-factory-card
  [title]="lineName"
  [subtitle]="statusText"
  [readinessPercent]="readinessPercent"
  [workersCurrent]="0"
  [workersRequired]="totalStages"
  [status]="status"
>
  <footer class="plp-production-line-card__footer">
    <span>المرحلة النشطة: {{ activeStage || 'غير محدد' }}</span>
    <plp-status-badge [status]="status" [label]="statusText"></plp-status-badge>
  </footer>
</plp-factory-card>
