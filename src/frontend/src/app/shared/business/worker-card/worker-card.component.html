<article class="plp-worker-card">
  <plp-worker-avatar [fullName]="safeFullName" [code]="safeCode" [status]="status"></plp-worker-avatar>
  <div class="plp-worker-card__details">
    <h3>{{ safeFullName || 'عامل غير محدد' }}</h3>
    <p>كود: {{ safeCode || '؟' }}</p>
    <p>{{ safeAssignmentType || 'غير محدد' }}</p>
    <p *ngIf="safeLastActivity">{{ safeLastActivity }}</p>
  </div>
  <plp-status-badge [status]="status"></plp-status-badge>
</article>
