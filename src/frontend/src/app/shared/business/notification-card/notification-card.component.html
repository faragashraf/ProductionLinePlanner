<article class="plp-notification-card" [class]="readStateClass">
  <header class="plp-notification-card__head">
    <plp-status-badge [status]="severity"></plp-status-badge>
    <span class="plp-notification-card__state">{{ isRead ? 'مقروء' : 'غير مقروء' }}</span>
  </header>
  <h3>{{ title }}</h3>
  <p>{{ message }}</p>
</article>
