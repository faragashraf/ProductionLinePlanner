<section class="page-frame departments-page" dir="rtl">
  <plp-page-header title="الأقسام التشغيلية" description="إدارة الأقسام المحلية المرتبطة بهيكل المصنع، بعيدًا عن مصدر الحضور." [compact]="true">
    <div header-actions>
      <button
        pButton
        class="p-button-sm p-button-outlined"
        type="button"
        icon="pi pi-refresh"
        label="تحديث"
        [disabled]="isLoading"
        (click)="onRefresh()"
        aria-label="تحديث قائمة الأقسام"
      ></button>
    </div>
  </plp-page-header>

  <plp-product-toolbar
    searchInputId="departmentsSearch"
    searchLabel="بحث في الأقسام"
    searchPlaceholder="ابحث باسم القسم أو الكود"
    [searchValue]="searchTerm"
    [clearEnabled]="true"
    (searchValueChange)="onSearchValue($event)"
  ></plp-product-toolbar>

  <plp-loading-skeleton *ngIf="isLoading && !hasLoadedOnce" [lines]="5" [showAvatar]="false"></plp-loading-skeleton>

  <p class="departments-refresh-status" *ngIf="isLoading && hasLoadedOnce" role="status">
    <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    جارٍ تحديث قائمة الأقسام مع إبقاء البيانات الحالية ظاهرة.
  </p>

  <plp-error-state
    *ngIf="hasError && hasLoadedOnce"
    [title]="'تعذر تحميل قائمة الأقسام'"
    [description]="errorMessage"
    [actionText]="errorRetryText"
    (action)="onRefresh()"
  ></plp-error-state>

  <section class="departments-empty" *ngIf="isEmpty && hasLoadedOnce && !hasError && !isLoading">
    <plp-empty-state
      title="لا توجد أقسام"
      description="لا توجد بيانات أقسام متاحة حالياً."
      actionText="تحديث"
      (action)="onRefresh()"
    ></plp-empty-state>
  </section>

  <section class="departments-empty" *ngIf="isSearchableEmpty && !hasError && !isLoading">
    <plp-empty-state
      title="لا توجد نتائج"
      [description]="'لا توجد نتائج مطابقة لكلمة البحث: ' + searchTerm"
      actionText="مسح البحث"
      (action)="onClearSearch()"
    ></plp-empty-state>
  </section>

  <section class="departments-table-shell" *ngIf="filteredDepartments.length > 0" [attr.aria-busy]="isLoading || null">
    <p-table plpResponsiveTable="scroll" plpTablePagination [plpPaginationPageSize]="10" [plpPaginationResetKey]="searchTerm" [value]="filteredDepartments" dataKey="id" responsiveLayout="scroll" [scrollHeight]="'auto'">
      <ng-template pTemplate="header">
        <tr>
          <th>كود القسم</th>
          <th>اسم القسم</th>
          <th>الحالة</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-department>
        <tr>
          <td><span class="plp-code">{{ departmentCode(department) }}</span></td>
          <td>{{ departmentName(department) }}</td>
          <td><plp-status-badge [status]="department.isActive === false ? 'inactive' : 'ready'" [label]="displayStatus(department)" [compact]="true"></plp-status-badge></td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3">لا يوجد عناصر لعرضها.</td>
        </tr>
      </ng-template>
    </p-table>
  </section>
</section>
