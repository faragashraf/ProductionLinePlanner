<section class="page-frame factory-structure-page" dir="rtl">
  <plp-page-header title="بنية المصنع" description="شجرة موحدة للمصانع والأقسام وخطوط الإنتاج والمراحل." [compact]="true">
    <div header-actions class="factory-structure-page__header-actions">
      <button pButton type="button" class="p-button-sm p-button-outlined" icon="pi pi-plus" label="إضافة مصنع" *ngIf="canManageStructure" [disabled]="isSaving" (click)="openAddFactory()"></button>
      <button pButton type="button" class="p-button-sm p-button-outlined" icon="pi pi-refresh" label="تحديث" [disabled]="isLoading || isSaving" (click)="reload()"></button>
    </div>
  </plp-page-header>

  <section class="factory-structure-page__toolbar" aria-label="أدوات الشجرة">
    <plp-product-toolbar searchInputId="factoryStructureSearch" searchLabel="بحث في بنية المصنع" searchPlaceholder="ابحث بالاسم أو الكود" [searchValue]="searchTerm" [clearEnabled]="true" (searchValueChange)="onSearchValue($event)"></plp-product-toolbar>
    <div class="factory-structure-page__tree-actions">
      <button pButton type="button" class="p-button-sm p-button-text" icon="pi pi-plus" label="توسيع الكل" [disabled]="isLoading" (click)="expandAll()"></button>
      <button pButton type="button" class="p-button-sm p-button-text" icon="pi pi-minus" label="طي الكل" [disabled]="isLoading" (click)="collapseAll()"></button>
    </div>
  </section>

  <plp-loading-skeleton *ngIf="isLoading && !hasLoadedOnce" [lines]="8" [showAvatar]="false"></plp-loading-skeleton>
  <p class="factory-structure-page__refresh-status" *ngIf="isLoading && hasLoadedOnce" role="status"><i class="pi pi-spin pi-spinner" aria-hidden="true"></i> جارٍ تحديث بنية المصنع مع إبقاء الشجرة ظاهرة.</p>
  <plp-error-state *ngIf="hasError && hasLoadedOnce" title="تعذر تحميل بنية المصنع" [description]="errorMessage" actionText="إعادة المحاولة" (action)="reload()"></plp-error-state>
  <p class="factory-structure-page__message" *ngIf="successMessage && !hasError">{{ successMessage }}</p>
  <p class="factory-structure-form__error" role="alert" *ngIf="actionError">{{ actionError }}</p>
  <plp-empty-state *ngIf="isEmpty && hasLoadedOnce && !isLoading && !hasError" title="لا توجد مصانع" description="لا توجد بيانات مصنع لعرضها حالياً." actionText="تحديث" (action)="reload()"></plp-empty-state>
  <plp-empty-state *ngIf="hasStructureData && !isLoading && !hasError && !visibleTreeNodes.length" title="لا توجد نتائج" description="لا توجد عناصر تطابق البحث بالاسم أو الكود." actionText="مسح البحث" (action)="onClearSearch()"></plp-empty-state>

  <section class="factory-structure-page__tree-shell" *ngIf="hasStructureData && visibleTreeNodes.length">
    <p-contextMenu #nodeMenu [model]="contextMenuItems" appendTo="body"></p-contextMenu>
    <p-tree
      [value]="visibleTreeNodes"
      selectionMode="single"
      [(selection)]="selectedNode"
      [contextMenu]="nodeMenu"
      [loading]="isLoading"
      [propagateSelectionUp]="false"
      [propagateSelectionDown]="false"
      (onNodeExpand)="onNodeExpand($event)"
      (onNodeCollapse)="onNodeCollapse($event)"
      (onNodeSelect)="onNodeSelect($event)"
      (onNodeContextMenuSelect)="onNodeContextMenuSelect($event)"
    >
      <ng-template pTemplate="default" let-node>
        <div class="factory-structure-node" [class.factory-structure-node--inactive]="!node.data.isActive" [class.factory-structure-node--department]="node.data.entityType === 'department'" [class.factory-structure-node--line]="node.data.entityType === 'line'">
          <span class="factory-structure-node__type-icon" [class.factory-structure-node__type-icon--factory]="node.data.entityType === 'factory'"><i [class]="nodeIcon(node.data.entityType)" aria-hidden="true"></i></span>
          <span class="factory-structure-node__content">
            <strong>{{ node.data.name }}</strong>
            <span class="plp-code" *ngIf="node.data.code">{{ node.data.code }}</span>
          </span>
          <plp-status-badge [status]="node.data.isActive ? 'ready' : 'warning'" [label]="node.data.isActive ? 'نشط' : 'غير نشط'" [compact]="true"></plp-status-badge>
          <button pButton type="button" class="p-button-rounded p-button-text p-button-sm factory-structure-node__menu" icon="pi pi-ellipsis-v" aria-label="إجراءات العنصر" title="إجراءات" [disabled]="isSaving || (!canManageStructure && !canManageDepartments)" (click)="openNodeMenu($event, node)"></button>
        </div>
      </ng-template>
    </p-tree>
  </section>

  <p-dialog [visible]="!!activeForm" [modal]="true" [appendTo]="'body'" [closable]="!isSaving" [draggable]="false" [resizable]="false" [style]="{ width: 'min(42rem, calc(100vw - 2rem))' }" [header]="formTitle" (onHide)="closeForm()">
    <form class="factory-structure-form" (ngSubmit)="submitActiveForm()" novalidate>
      <ng-container [ngSwitch]="activeForm">
        <ng-container *ngSwitchCase="'factory'">
          <label>اسم المصنع<input name="factoryName" [(ngModel)]="factoryDraft.name" [disabled]="isSaving" required></label>
          <label>كود المصنع<input name="factoryCode" [(ngModel)]="factoryDraft.code" [readonly]="!!factoryDraft.id" [disabled]="isSaving" required><small *ngIf="factoryDraft.id">لا يمكن تعديل الكود بعد إنشاء السجل.</small></label>
          <label>الموقع<input name="factoryLocation" [(ngModel)]="factoryDraft.location" [disabled]="isSaving"></label>
          <label class="factory-structure-form__toggle"><input name="factoryActive" type="checkbox" [(ngModel)]="factoryDraft.isActive" [disabled]="isSaving">نشط</label>
        </ng-container>
        <ng-container *ngSwitchCase="'department'">
          <label>المصنع<select name="departmentFactory" [(ngModel)]="departmentDraft.factoryId" [disabled]="isSaving || !!departmentDraft.id" required><option value="">اختر المصنع</option><option *ngFor="let factory of factories" [value]="factory.id">{{ factory.code }} — {{ factory.name }}</option></select></label>
          <label>كود القسم<input name="departmentCode" [(ngModel)]="departmentDraft.code" [readonly]="!!departmentDraft.id" [disabled]="isSaving" required><small *ngIf="departmentDraft.id">لا يمكن تعديل الكود بعد إنشاء السجل.</small></label>
          <label>اسم القسم بالعربية<input name="departmentNameAr" [(ngModel)]="departmentDraft.nameAr" [disabled]="isSaving" required></label>
          <label>اسم القسم بالإنجليزية<input name="departmentNameEn" [(ngModel)]="departmentDraft.nameEn" [disabled]="isSaving"></label>
          <label>الترتيب<input name="departmentOrder" type="number" [(ngModel)]="departmentDraft.sequenceOrder" [disabled]="isSaving"></label>
          <label class="factory-structure-form__toggle"><input name="departmentActive" type="checkbox" [(ngModel)]="departmentDraft.isActive" [disabled]="isSaving">نشط</label>
        </ng-container>
        <ng-container *ngSwitchCase="'line'">
          <label>المصنع<select name="lineFactory" [(ngModel)]="lineDraft.factoryId" [disabled]="isSaving || !!lineDraft.id" required><option value="">اختر المصنع</option><option *ngFor="let factory of factories" [value]="factory.id">{{ factory.code }} — {{ factory.name }}</option></select></label>
          <label>القسم<select name="lineDepartment" [(ngModel)]="lineDraft.departmentId" [disabled]="isSaving" required><option value="">اختر القسم</option><option *ngFor="let department of departments" [value]="department.id">{{ department.code }} — {{ department.nameAr || department.name }}</option></select></label>
          <label>اسم الخط<input name="lineName" [(ngModel)]="lineDraft.name" [disabled]="isSaving" required></label>
          <label>كود الخط<input name="lineCode" [(ngModel)]="lineDraft.lineCode" [readonly]="!!lineDraft.id" [disabled]="isSaving"><small *ngIf="lineDraft.id">لا يمكن تعديل الكود بعد إنشاء السجل.</small></label>
          <label>الترتيب<input name="lineOrder" type="number" [(ngModel)]="lineDraft.sequenceOrder" [disabled]="isSaving"></label>
          <label class="factory-structure-form__toggle"><input name="lineActive" type="checkbox" [(ngModel)]="lineDraft.isActive" [disabled]="isSaving">نشط</label>
        </ng-container>
      </ng-container>
      <p class="factory-structure-form__error" *ngIf="hasError">{{ errorMessage }}</p>
      <footer class="factory-structure-form__actions"><button pButton type="button" class="p-button-text" label="إلغاء" [disabled]="isSaving" (click)="closeForm()"></button><button pButton type="submit" [label]="formSubmitLabel" [loading]="isSaving" [disabled]="isSaving"></button></footer>
    </form>
  </p-dialog>
</section>
