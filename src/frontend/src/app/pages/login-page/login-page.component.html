<main class="plp-login" plpMotion>
  <section class="plp-login__brand" aria-labelledby="login-brand-title">
    <plp-brand-logo class="plp-login__brand-mark" variant="login" size="56px" [animated]="true" [label]="productIdentity.logoLabelAr"></plp-brand-logo>
    <h1 id="login-brand-title" class="plp-text-display" dir="ltr">{{ productIdentity.nameEn }}</h1>
    <p class="plp-login__eyebrow">{{ productIdentity.nameAr }}</p>
    <p class="plp-text-supporting">{{ productIdentity.taglineAr }}</p>
    <div class="plp-login__brand-points" aria-label="مزايا المنصة">
      <span><i class="pi pi-check-circle" aria-hidden="true"></i> تشغيل واضح</span>
      <span><i class="pi pi-check-circle" aria-hidden="true"></i> إدارة أسرع</span>
      <span><i class="pi pi-check-circle" aria-hidden="true"></i> بيانات موثوقة</span>
    </div>
  </section>

  <section class="plp-login__panel" aria-labelledby="login-title">
    <div class="plp-login__panel-header">
      <p class="plp-login__panel-kicker">بوابة التشغيل</p>
      <h2 id="login-title" class="plp-text-page-title">تسجيل الدخول</h2>
      <p class="plp-text-supporting">أدخل بيانات حسابك للمتابعة إلى مساحة العمل.</p>
    </div>

    <plp-form [busy]="isLoading" (submitted)="onLogin()">
      <plp-form-field
        label="اسم المستخدم"
        controlId="login-email"
        [required]="true"
        [disabled]="isLoading"
        [error]="emailValidationMessage"
      >
        <input
          pInputText
          class="plp-control"
          id="login-email"
          name="email"
          type="text"
          autocomplete="username"
          [value]="email"
          [disabled]="isLoading"
          [attr.aria-invalid]="emailValidationMessage ? 'true' : null"
          (input)="onEmailChanged($any($event.target).value)"
        />
      </plp-form-field>

      <plp-form-field
        label="كلمة المرور"
        controlId="login-password"
        [required]="true"
        [disabled]="isLoading"
        [error]="passwordValidationMessage"
      >
        <div class="plp-login__password-control">
          <input
            pInputText
            class="plp-control"
            id="login-password"
            name="password"
            [type]="isPasswordVisible ? 'text' : 'password'"
            autocomplete="current-password"
            [value]="password"
            [disabled]="isLoading"
            [attr.aria-invalid]="passwordValidationMessage ? 'true' : null"
            (input)="onPasswordChanged($any($event.target).value)"
          />
          <button
            pButton
            type="button"
            class="p-button-text plp-login__password-toggle"
            [icon]="isPasswordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'"
            [disabled]="isLoading"
            [attr.aria-label]="isPasswordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
            [attr.title]="isPasswordVisible ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور'"
            (click)="togglePasswordVisibility()"
          ></button>
        </div>
      </plp-form-field>

      <p-message
        *ngIf="errorMessage"
        severity="error"
        [text]="errorMessage"
        styleClass="plp-login__message"
      ></p-message>
      <p-message
        *ngIf="warningMessage"
        severity="info"
        [text]="warningMessage"
        styleClass="plp-login__message"
      ></p-message>

      <plp-action-button
        action="save"
        buttonType="submit"
        label="دخول إلى مساحة العمل"
        [loading]="isLoading"
        [disabled]="isLoading"
      ></plp-action-button>
    </plp-form>
  </section>
</main>
