<section class="page-frame">
  <header class="page-header">
    <h1>Production Lines</h1>
  </header>
  <div class="placeholder-list">
    <article class="line-item" *ngFor="let line of lines">
      <h2>{{ line.name }}</h2>
      <p>الحالة: {{ line.status }}</p>
      <button type="button" class="primary-button">فتح</button>
    </article>
  </div>
</section>
