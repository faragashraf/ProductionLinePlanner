<section class="page-frame">
  <header class="page-header">
    <h1>Workers</h1>
  </header>
  <div class="worker-list">
    <article class="worker-item" *ngFor="let worker of workers">
      <div>
        <h2>{{ worker.fullName }}</h2>
        <p>كود العامل: {{ worker.code }}</p>
      </div>
      <span class="ghost-pill">{{ worker.state }}</span>
    </article>
  </div>
</section>
