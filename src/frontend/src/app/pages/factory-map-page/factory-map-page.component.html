<section class="page-frame factory-visualization-page">
  <plp-page-header title="مؤشر التمثيل البصري للمصنع" description="هيكلية بياناتية تفاعلية تدعم التنقل بين مستويات المصنع دون استدعاء backend." [compact]="true">
    <div header-actions>
      <button
        type="button"
        class="p-button p-button-sm p-button-text"
        (click)="showFactory()"
        *ngIf="currentZoom !== 'factory'"
      >
        العودة لمستوى المصنع
      </button>
    </div>
  </plp-page-header>

  <nav class="factory-visualization-page__path" aria-label="مسار التنقل">
    <button
      type="button"
      class="factory-visualization-page__path-button"
      (click)="showFactory()"
      [class.factory-visualization-page__path-button--active]="currentZoom === 'factory'"
      [attr.aria-current]="currentZoom === 'factory' ? 'page' : null"
    >
      مصنع: {{ layout.name }}
    </button>

    <span *ngIf="selectedLine" class="factory-visualization-page__path-sep">/</span>
    <button
      *ngIf="selectedLine"
      type="button"
      class="factory-visualization-page__path-button"
      [class.factory-visualization-page__path-button--active]="currentZoom === 'line'"
      [attr.aria-current]="currentZoom === 'line' ? 'page' : null"
      (click)="showLine()"
      [disabled]="currentZoom === 'factory'"
    >
      {{ selectedLine.name }}
    </button>

    <span *ngIf="selectedMainStage" class="factory-visualization-page__path-sep">/</span>
    <button
      *ngIf="selectedMainStage"
      type="button"
      class="factory-visualization-page__path-button"
      [class.factory-visualization-page__path-button--active]="currentZoom === 'stage' || currentZoom === 'worker'"
      [attr.aria-current]="currentZoom === 'stage' ? 'page' : null"
      [disabled]="currentZoom === 'factory' || currentZoom === 'line'"
      (click)="showStage()"
    >
      {{ selectedMainStage.name }}
    </button>

    <span *ngIf="selectedSubStage && currentZoom === 'worker'" class="factory-visualization-page__path-sep">/</span>
    <button
      *ngIf="selectedSubStage && currentZoom === 'worker'"
      type="button"
      class="factory-visualization-page__path-button factory-visualization-page__path-button--active"
      aria-current="page"
    >
      {{ selectedSubStage.name }}
    </button>
  </nav>

  <plp-factory-renderer
    *ngIf="currentZoom === 'factory'"
    [layout]="layout"
    (lineSelected)="onLineSelected($event)"
  ></plp-factory-renderer>

  <plp-line-renderer
    *ngIf="currentZoom === 'line' && selectedLine"
    [line]="selectedLine"
    (backToFactory)="showFactory()"
    (mainStageSelected)="onMainStageSelected($event)"
  ></plp-line-renderer>

  <plp-stage-renderer
    *ngIf="currentZoom === 'stage' && selectedLine && selectedMainStage"
    [line]="selectedLine"
    [mainStage]="selectedMainStage"
    [mode]="'stage'"
    (back)="onStageBack($event)"
    (subStageSelected)="onSubStageSelected($event)"
  ></plp-stage-renderer>

  <plp-stage-renderer
    *ngIf="currentZoom === 'worker' && selectedLine && selectedMainStage && selectedSubStage"
    [line]="selectedLine"
    [mainStage]="selectedMainStage"
    [subStage]="selectedSubStage"
    [mode]="'worker'"
    (back)="onStageBack($event)"
    (subStageSelected)="onSubStageSelected($event)"
  ></plp-stage-renderer>
</section>
