<section class="model-selector" aria-labelledby="readiness-model-title">
  <div>
    <span>نطاق المراحل</span>
    <h3 id="readiness-model-title">اختر موديل الخط</h3>
    <p>كل موديل يُعرض كنطاق مستقل؛ لا تُجمع مراحل الموديلات كأنها تعمل معًا.</p>
  </div>
  <div class="model-selector__options" role="group" aria-label="موديلات الخط المتاحة">
    <button type="button" *ngFor="let model of models; trackBy: trackModel"
      [class.is-selected]="selectedModelId === model.id"
      [attr.aria-pressed]="selectedModelId === model.id"
      (click)="modelSelected.emit(model.id)">
      <i class="pi pi-tag" aria-hidden="true"></i>
      <span><strong>{{ model.name }}</strong><small>{{ model.stageCount }} مرحلة · {{ model.code }}</small></span>
      <i class="pi pi-chevron-left" aria-hidden="true"></i>
    </button>
  </div>
</section>
