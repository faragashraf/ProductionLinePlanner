<section class="plp-line-renderer">
  <header class="plp-line-renderer__header">
    <button type="button" class="plp-line-renderer__back" (click)="onBackToFactory()" aria-label="عودة إلى المصنع">
      <i class="pi pi-arrow-right" aria-hidden="true"></i>
      العودة للمصنع
    </button>
    <p class="plp-line-renderer__subtitle">عرض المراحل الرئيسية للخط المختار.</p>
  </header>

  <article class="plp-line-renderer__summary">
    <header>
      <div>
        <h2>{{ line.name }}</h2>
        <p>{{ line.statusText }}</p>
      </div>
      <plp-status-badge [status]="line.status ?? 'info'" [label]="line.statusText" [compact]="true"></plp-status-badge>
    </header>
    <div class="plp-line-renderer__summary-meta">
      <span>جاهزية: {{ line.readinessPercent ?? 0 }}%</span>
      <span>المراحل: {{ line.stages.length }}</span>
      <span>النشطة: {{ line.activeStageName }}</span>
    </div>
    <plp-completion-bar [value]="line.readinessPercent ?? 0" [status]="line.status ?? 'info'" label="جاهزية الخط"></plp-completion-bar>
  </article>

  <plp-responsive-grid class="plp-line-renderer__stages-grid" [minItemWidth]="240" [gap]="'var(--plp-spacing-2)'">
    <button
      type="button"
      class="plp-line-renderer__stage-button"
      *ngFor="let stage of line.stages; trackBy: trackByStage"
      (click)="onMainStageSelected(stage.id)"
      [attr.aria-label]="'فتح ' + stage.name"
    >
      <plp-main-stage-card
        [name]="stage.name"
        [workersCurrent]="stage.workersCurrent ?? 0"
        [workersRequired]="stage.workersRequired ?? 0"
        [status]="stage.status ?? 'info'"
        [note]="stage.note ?? ''"
      ></plp-main-stage-card>
      <span class="plp-line-renderer__link">فتح تفاصيل المرحلة</span>
    </button>
  </plp-responsive-grid>
</section>
